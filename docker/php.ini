; Réglages PHP propres à TomTroc (ajoutés après php.ini-production)

expose_php = Off

; le code refuse les images de plus de 2 Mo avec un message clair :
; PHP doit accepter un peu plus pour que ce message puisse s'afficher
upload_max_filesize = 4M
post_max_size = 8M

; stockage des sessions, choisi par variables d'environnement :
;   files + /tmp                 (défaut, un seul conteneur)
;   redis + tcp://redis:6379     (plusieurs réplicas qui partagent les sessions)
session.save_handler = ${SESSION_SAVE_HANDLER}
session.save_path = "${SESSION_SAVE_PATH}"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
