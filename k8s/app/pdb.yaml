# Pendant une maintenance (vidage d'un nœud, par exemple), au moins un pod de
# l'application reste toujours disponible
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tomtroc
  namespace: tomtroc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tomtroc
