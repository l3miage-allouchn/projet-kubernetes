# Images envoyées par les membres (public/uploads/). ReadWriteMany sur NFS :
# tous les réplicas, quel que soit leur nœud, lisent et écrivent le même dossier.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tomtroc-uploads
  namespace: tomtroc
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
