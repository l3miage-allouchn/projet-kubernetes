# Accès public à TomTroc par Traefik : https://tomtroc.localhost
# Le HTTP (port 80) est redirigé vers HTTPS par Traefik lui-même (infra/values/traefik.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tomtroc
  namespace: tomtroc
  annotations:
    # route uniquement sur le point d'entrée HTTPS (443)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tomtroc.localhost
      secretName: tomtroc-tls
  rules:
    - host: tomtroc.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tomtroc
                port:
                  name: http
