apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomtroc
  namespace: tomtroc
  labels:
    app.kubernetes.io/name: tomtroc
spec:
  # le HPA (hpa.yaml) ajuste ensuite ce nombre entre 2 et 4
  replicas: 2
  revisionHistoryLimit: 3
  # mise à jour sans coupure : un nouveau pod doit être prêt avant qu'un ancien s'arrête
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tomtroc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomtroc
    spec:
      serviceAccountName: tomtroc
      automountServiceAccountToken: false

      # www-data (uid/gid 33) ; fsGroup donne au groupe 33 le droit d'écrire dans le
      # volume des uploads
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault

      # répartir les pods sur les nœuds ; nodeTaintsPolicy: Honor ignore le
      # control-plane, qui refuse les pods de l'application
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tomtroc

      containers:
        - name: tomtroc
          image: nesrix/tomtroc:1.0.1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tomtroc-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password

          # startupProbe : laisse jusqu'à 60 s au démarrage avant que les autres probes
          # commencent. readinessProbe : le pod ne reçoit du trafic que s'il répond.
          # livenessProbe : le pod est redémarré s'il ne répond plus.
          startupProbe:
            httpGet:
              path: /health.php
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # le système de fichiers est en lecture seule : seuls les volumes ci-dessous
          # sont accessibles en écriture
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/public/uploads
            # fichiers temporaires de PHP (images en cours d'envoi)
            - name: tmp
              mountPath: /tmp
            # fichier PID et verrous d'Apache
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-lock
              mountPath: /var/lock/apache2
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tomtroc-uploads
        - name: tmp
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
        - name: apache-lock
          emptyDir: {}
