# Ajoute des pods quand la charge CPU moyenne dépasse 70 % de la request (70m),
# entre 2 (haute dispo) et 4 (limite de mémoire du Mac). Mesures fournies par metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tomtroc
  namespace: tomtroc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tomtroc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
