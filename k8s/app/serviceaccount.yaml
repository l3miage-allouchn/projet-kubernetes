# RBAC minimal : l'application n'appelle jamais l'API Kubernetes, elle n'a donc besoin
# d'aucun droit. Son ServiceAccount n'est lié à aucun Role, et le jeton n'est pas monté
# dans les pods : un attaquant qui prendrait le contrôle du conteneur n'aurait rien pour
# parler à l'API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tomtroc
  namespace: tomtroc
automountServiceAccountToken: false
