# Réglages non secrets de l'application, lus par docker/config.php et docker/php.ini.
# Le mot de passe de la base vient du Secret mariadb-credentials (voir deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tomtroc-config
  namespace: tomtroc
data:
  # le Service "primary" envoie toutes les écritures au même nœud Galera :
  # pas de conflit entre deux nœuds qui modifient la même ligne
  DB_HOST: mariadb-galera-primary
  DB_NAME: tomtroc
  DB_USER: tomtroc
  # sessions partagées entre les réplicas
  SESSION_SAVE_HANDLER: redis
  SESSION_SAVE_PATH: tcp://redis:6379
