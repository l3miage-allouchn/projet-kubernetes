# Adresse stable de l'application dans le cluster (tomtroc.tomtroc.svc), qui répartit
# les requêtes entre les pods prêts
apiVersion: v1
kind: Service
metadata:
  name: tomtroc
  namespace: tomtroc
  labels:
    app.kubernetes.io/name: tomtroc
spec:
  selector:
    app.kubernetes.io/name: tomtroc
  ports:
    - name: http
      port: 80
      targetPort: http
