# RBAC minimal : l'application n'appelle jamais l'API Kubernetes. Ce ServiceAccount
# n'est lié à aucun Role et son jeton n'est pas monté dans les pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tomtroc.fullname" . }}
  labels:
    {{- include "tomtroc.labels" . | nindent 4 }}
automountServiceAccountToken: false
