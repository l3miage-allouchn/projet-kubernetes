{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tomtroc.fullname" . }}
  labels:
    {{- include "tomtroc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  # avec Flagger, la version en production est dans les pods "tomtroc-primary"
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ if .Values.canary.enabled }}tomtroc-primary{{ else }}tomtroc{{ end }}
{{- end }}
