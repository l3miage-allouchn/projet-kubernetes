{{- /* Un Service par variante (voir deployment.yaml) */ -}}
{{- $variants := list (dict "name" (include "tomtroc.fullname" .) "app" "tomtroc") }}
{{- if .Values.abTesting.enabled }}
{{- $variants = append $variants (dict "name" (printf "%s-b" (include "tomtroc.fullname" .)) "app" "tomtroc-b") }}
{{- end }}
{{- range $v := $variants }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  labels:
    app.kubernetes.io/name: {{ $v.app }}
    {{- include "tomtroc.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $v.app }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
