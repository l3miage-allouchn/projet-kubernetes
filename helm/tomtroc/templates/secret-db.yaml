{{- /*
Mots de passe de la base. lookup lit le Secret déjà présent dans le cluster : s'il
existe, on garde ses valeurs ; sinon on en génère de nouvelles. Sans cela, chaque
"helm upgrade" changerait les mots de passe et l'application ne pourrait plus se
connecter. Gardé après "helm uninstall" (resource-policy: keep).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.mariadb.credentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mariadb.credentialsSecret }}
  labels:
    app.kubernetes.io/name: mariadb
    {{- include "tomtroc.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  root-password: {{ index $existing.data "root-password" }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  root-password: {{ randAlphaNum 32 | b64enc }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
