# Base de données de TomTroc : cluster MariaDB Galera à 3 nœuds, géré par mariadb-operator.
# Galera est une réplication synchrone multi-maître : chaque nœud a toutes les données
# et une écriture n'est validée que si la majorité des nœuds (2 sur 3) l'accepte.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
  namespace: tomtroc
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-credentials
    key: root-password

  # utilisateur et base de l'application, créés par l'opérateur
  # (l'utilisateur reçoit tous les droits sur la base tomtroc)
  username: tomtroc
  passwordSecretKeyRef:
    name: mariadb-credentials
    key: password
  database: tomtroc

  # 3 nœuds : nombre impair, pour qu'une majorité existe toujours après une panne
  replicas: 3

  galera:
    enabled: true
    providerOptions:
      # cache des écritures récentes, pour resynchroniser un nœud qui revient
      # (128M par défaut, réduit faute de mémoire)
      gcache.size: 64M

  storage:
    size: 1Gi
    storageClassName: local-path

  # un pod MariaDB par nœud : un nœud qui tombe n'emporte qu'un seul membre du cluster
  affinity:
    antiAffinityEnabled: true

  # le control-plane refuse les pods (taint NoSchedule) et il n'y a que 2 workers :
  # sans cette toleration, 2 des 3 pods seraient sur le même worker, et l'arrêt de
  # ce worker ferait perdre la majorité. Compromis de labo (en production : 3 workers).
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    character_set_server=utf8mb4
    collation_server=utf8mb4_unicode_ci
    # réglages réduits pour un Mac avec peu de mémoire
    innodb_buffer_pool_size=64M
    max_connections=50
    performance_schema=OFF

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
