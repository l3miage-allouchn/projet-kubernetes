# Import du schéma et des données de test (app/sql/tomtroc.sql) une fois le cluster prêt.
# Le script est dans la ConfigMap "tomtroc-sql", créée par infra/database/install.sh.
# Attention : tomtroc.sql commence par des DROP TABLE. Le SqlJob ne s'exécute qu'une
# fois ; le supprimer puis le recréer remettrait la base à zéro.
apiVersion: k8s.mariadb.com/v1alpha1
kind: SqlJob
metadata:
  name: tomtroc-init
  namespace: tomtroc
spec:
  mariaDbRef:
    name: mariadb-galera
  username: tomtroc
  passwordSecretKeyRef:
    name: mariadb-credentials
    key: password
  database: tomtroc
  sqlConfigMapKeyRef:
    name: tomtroc-sql
    key: tomtroc.sql
