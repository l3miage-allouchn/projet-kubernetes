# Test du stockage partagé : un PVC ReadWriteMany monté par deux pods,
# chacun sur un worker différent. L'écrivain écrit, le lecteur doit voir le fichier.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwx-test
  namespace: default
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-writer
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: desktop-worker
  containers:
    - name: writer
      image: busybox:1.37
      command: ["sh", "-c", "echo \"écrit depuis $(hostname) sur desktop-worker\" > /data/test.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rwx-test
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-reader
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: desktop-worker2
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rwx-test
